<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODO ENDO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#f2efe9;--panel:#fbf9f5;--ink:#23262c;--mute:#807d76;--line:#ddd7ca;
  --accent:#8a6d3b;--accent-ink:#fbf9f5;--soft:#ece6d9;
  --p1:#8c3b3b;--p2:#8a6d3b;--p3:#5f7a6a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15171c;--panel:#1d2026;--ink:#e9e5db;--mute:#8d8b85;--line:#2e323a;
    --accent:#c4a76d;--accent-ink:#15171c;--soft:#262a32;
    --p1:#d08484;--p2:#c4a76d;--p3:#8fae9d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171c;--panel:#1d2026;--ink:#e9e5db;--mute:#8d8b85;--line:#2e323a;
  --accent:#c4a76d;--accent-ink:#15171c;--soft:#262a32;
  --p1:#d08484;--p2:#c4a76d;--p3:#8fae9d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{font-family:"Cormorant Garamond","Noto Serif JP",Georgia,serif;font-size:34px;font-weight:600;letter-spacing:.18em;line-height:1.1}
.brand small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:11px;letter-spacing:.3em;color:var(--mute);font-weight:400;margin-top:6px}
nav{display:flex;gap:4px}
nav a{padding:8px 18px;color:var(--mute);text-decoration:none;font-size:13px;letter-spacing:.12em;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
.grid.two{grid-template-columns:1fr 1.2fr}
@media (max-width:820px){.grid,.grid.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);padding:22px 24px}
.card h2{margin:0 0 16px;font-family:"Noto Serif JP",Georgia,serif;font-weight:500;font-size:16px;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 a{font-family:"Noto Sans JP",sans-serif;font-size:12px;letter-spacing:.06em;color:var(--accent);text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:22px}
.empty{color:var(--mute);font-size:13px;margin:6px 0}
ul{list-style:none;margin:0;padding:0}
.todo{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .t{flex:1;word-break:break-word}
.pri{flex:none;width:26px;height:26px;border:1px solid currentColor;display:grid;place-items:center;font-size:12px;font-family:"Noto Serif JP",serif}
.dots{flex:none;width:1.6em;font-size:11px;color:var(--ink)}
.p1{color:var(--p1)}.p2{color:var(--p2)}.p3{color:var(--p3)}
button,.btn{font:inherit;font-size:13px;letter-spacing:.08em;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{opacity:.88;color:var(--accent-ink)}
button.ghost{padding:5px 10px;font-size:12px;color:var(--mute)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:12px;letter-spacing:.1em;color:var(--mute)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px 11px;border-radius:0;width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head .m{font-family:"Cormorant Garamond","Noto Serif JP",serif;font-size:24px;letter-spacing:.14em;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:11px;color:var(--mute);letter-spacing:.1em;padding:4px 0}
.cal .w:first-child,.cal .d.sun{color:var(--p1)}
.cal .w:nth-child(7),.cal .d.sat{color:var(--p3)}
.cal .d{position:relative;aspect-ratio:1/1;max-height:56px;display:grid;place-items:center;border:1px solid transparent;background:transparent;padding:0;font-size:14px;letter-spacing:0;color:inherit}
.cal .d:hover{border-color:var(--line);color:inherit}
.cal .d.blank{pointer-events:none}
.cal .d.today{background:var(--soft);font-weight:500}
.cal .d.sel{border-color:var(--accent)}
.cal .d.has::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.day h3{margin:0 0 8px;font-size:13px;font-weight:500;letter-spacing:.1em}
.ev{display:flex;align-items:baseline;gap:12px;padding:7px 0}
.ev .tm{flex:none;width:46px;font-size:12px;color:var(--accent);letter-spacing:.04em}
.ev .t{flex:1;word-break:break-word}
.group{margin-bottom:12px}
.group h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:3px}
footer{margin-top:40px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mute)}
@media (max-width:600px){
  .wrap{padding:20px 14px 44px}
  .brand{font-size:28px}
  nav{width:100%}
  nav a{flex:1;text-align:center;padding:10px 6px}
  .card{padding:18px 16px}
  button{min-height:40px}
  button.ghost{min-height:36px;padding:6px 12px}
  .cal .d{max-height:none;min-height:42px}
}
footer button{margin-left:12px;letter-spacing:.1em}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .n{flex:1;min-width:0;word-break:break-all}
.frow .m{flex:none;font-size:12px;color:var(--mute)}
@media (max-width:600px){.frow{flex-wrap:wrap}.frow .n{flex-basis:100%}.frow .m{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">TODO ENDO<small>予定とTODOの管理</small></div>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <footer><span id="sync"></span><button id="logout" class="ghost" hidden>ログアウト</button></footer>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, collection, query, orderBy, onSnapshot, setDoc, getDocs, writeBatch, Bytes } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ============================================================
// ここにFirebaseの設定値を貼り付けてください（Firebaseコンソールに表示されるもの）
// ============================================================
var firebaseConfig = {
  apiKey: "AIzaSyA9AT5fyugo-Vl6Td8HVe3U5APTHzicry4",
  authDomain: "todo-endo-b3d0c.firebaseapp.com",
  projectId: "todo-endo-b3d0c",
  storageBucket: "todo-endo-b3d0c.firebasestorage.app",
  messagingSenderId: "1077913362556",
  appId: "1:1077913362556:web:e8e3cbce839a1d36c129f9"
};
var configured = firebaseConfig.apiKey.indexOf('YOUR_') !== 0;

// ---------- データ(Firebaseのサーバーに保存) ----------
var data = { todos: [], events: [] };
var user = null, loaded = false, ref = null, unsub = null;
var writing = false, dirty = false;
var files = [], filesUnsub = null, fileMsg = '', busy = false;
var auth = null, db = null;
if (configured) {
  var fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
}

function setSync(t) { var el = document.getElementById('sync'); if (el) el.textContent = t; }
function save() { push(); }
async function push() {
  if (!ref) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try {
    do {
      dirty = false;
      await setDoc(ref, { todos: data.todos, events: data.events });
    } while (dirty);
    setSync('サーバーに保存済み');
  } catch (e) {
    setSync('保存に失敗しました。通信状況を確認してください');
  } finally { writing = false; }
}
// 入力中は画面を書き換えず、入力が終わってから反映する
function softRender() {
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) {
    document.addEventListener('focusout', function f() { document.removeEventListener('focusout', f); setTimeout(render, 0); });
    return;
  }
  render();
}

// ---------- ファイル共有(Firestoreに小分けして保存) ----------
// Cloud Storageは有料プランが必要なため、Firestoreの無料枠に収まる範囲で保存する
var MAX_FILE = 5 * 1024 * 1024;   // 1ファイルの上限 5MB
var CHUNK = 800000;               // 1ドキュメントに入れるバイト数(上限1MiB未満)
function setFileMsg(t) { fileMsg = t; var el = document.getElementById('filemsg'); if (el) el.textContent = t; }
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
function fmtDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function partRef(fid, i) { return doc(db, 'users', user.uid, 'files', fid, 'parts', String(i).padStart(4, '0')); }

async function uploadFile(file) {
  if (busy) return;
  if (file.size === 0) { setFileMsg('空のファイルは保存できません'); return; }
  if (file.size > MAX_FILE) { setFileMsg('ファイルが大きすぎます（上限 ' + fmtSize(MAX_FILE) + '）'); return; }
  busy = true;
  var fid = uid(), done = 0, n = 0;
  try {
    var buf = new Uint8Array(await file.arrayBuffer());
    n = Math.ceil(buf.length / CHUNK);
    for (var i = 0; i < n; i++) {
      setFileMsg('保存中… ' + (i + 1) + ' / ' + n);
      await setDoc(partRef(fid, i), { data: Bytes.fromUint8Array(buf.slice(i * CHUNK, (i + 1) * CHUNK)) });
      done++;
    }
    // 中身をすべて保存してから一覧に載せる
    await setDoc(doc(db, 'users', user.uid, 'files', fid), { name: file.name, size: file.size, type: file.type || '', chunks: n, createdAt: Date.now() });
    setFileMsg('保存しました：' + file.name);
  } catch (e) {
    try { var b = writeBatch(db); for (var k = 0; k < done; k++) b.delete(partRef(fid, k)); await b.commit(); } catch (e2) {}
    setFileMsg('保存に失敗しました。通信状況を確認してください');
  } finally { busy = false; }
}

async function downloadFile(f) {
  setFileMsg('取得中…');
  try {
    var snap = await getDocs(collection(db, 'users', user.uid, 'files', f.id, 'parts'));
    if (snap.size !== f.chunks) throw new Error('incomplete');
    var parts = snap.docs.slice().sort(function (a, b) { return a.id.localeCompare(b.id); })
      .map(function (d) { return d.data().data.toUint8Array(); });
    var url = URL.createObjectURL(new Blob(parts, { type: f.type || 'application/octet-stream' }));
    var a = document.createElement('a');
    a.href = url; a.download = f.name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    setFileMsg('');
  } catch (e) { setFileMsg('ファイルを取得できませんでした'); }
}

async function deleteFile(f) {
  if (!confirm('「' + f.name + '」を削除しますか？')) return;
  try {
    var b = writeBatch(db);
    for (var i = 0; i < f.chunks; i++) b.delete(partRef(f.id, i));
    b.delete(doc(db, 'users', user.uid, 'files', f.id));
    await b.commit();
    setFileMsg('削除しました');
  } catch (e) { setFileMsg('削除に失敗しました'); }
}

// ---------- 小さな道具 ----------
function h(tag, props) {
  var el = document.createElement(tag);
  for (var k in (props || {})) {
    if (k === 'class') el.className = props[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), props[k]);
    else el.setAttribute(k, props[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) c.forEach(function (x) { el.append(x); });
    else el.append(c);
  }
  return el;
}
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function label(s) { var d = parse(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
var PRI = { 1: '高', 2: '中', 3: '低' };
function byTime(a, b) { return (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')); }
function eventsOn(s) { return data.events.filter(function (e) { return e.date === s; }).sort(byTime); }

var today = ymd(new Date());
var month = new Date(); month.setDate(1);
var selected = today;

// ---------- 部品 ----------
function eventRow(e, withDelete) {
  return h('li', { class: 'ev' },
    h('span', { class: 'tm' }, e.time || '終日'),
    h('span', { class: 't' }, e.title),
    withDelete ? h('button', { class: 'ghost', 'aria-label': '予定を削除', onclick: function () {
      data.events = data.events.filter(function (x) { return x.id !== e.id; }); save(); render();
    } }, '削除') : null);
}

function todoList(withDelete) {
  var list = data.todos.slice().sort(function (a, b) { return a.pri - b.pri || a.id.localeCompare(b.id); });
  if (!list.length) return h('p', { class: 'empty' }, 'TODOはありません。');
  return h('ul', null, list.map(function (t) {
    return h('li', { class: 'todo' },
      withDelete
        ? h('span', { class: 'pri p' + t.pri, title: '優先度：' + PRI[t.pri] }, PRI[t.pri])
        : h('span', { class: 'dots', title: '優先度：' + PRI[t.pri], 'aria-label': '優先度：' + PRI[t.pri] }, '●'),
      h('span', { class: 't' }, t.text),
      withDelete ? h('button', { onclick: function () {
        data.todos = data.todos.filter(function (x) { return x.id !== t.id; }); save(); render();
      } }, '完了・削除') : null);
  }));
}

function calendar() {
  var y = month.getFullYear(), m = month.getMonth();
  var first = new Date(y, m, 1).getDay();
  var days = new Date(y, m + 1, 0).getDate();
  var cells = WD.map(function (w) { return h('div', { class: 'w' }, w); });
  for (var i = 0; i < first; i++) cells.push(h('div', { class: 'd blank' }));
  var _loop = function (d) {
    var s = y + '-' + pad(m + 1) + '-' + pad(d);
    var wd = new Date(y, m, d).getDay();
    var cls = 'd' + (wd === 0 ? ' sun' : '') + (wd === 6 ? ' sat' : '') + (s === today ? ' today' : '') +
      (s === selected ? ' sel' : '') + (eventsOn(s).length ? ' has' : '');
    cells.push(h('button', { class: cls, 'aria-label': (m + 1) + '月' + d + '日', onclick: function () { selected = s; render(); } }, String(d)));
  };
  for (var d = 1; d <= days; d++) _loop(d);

  var evs = eventsOn(selected);
  return h('section', { class: 'card' },
    h('h2', null, 'カレンダー', h('a', { href: '#schedule' }, '予定を登録 →')),
    h('div', { class: 'cal-head' },
      h('button', { 'aria-label': '前の月', onclick: function () { month = new Date(y, m - 1, 1); render(); } }, '‹'),
      h('span', { class: 'm' }, y + '年 ' + (m + 1) + '月'),
      h('button', { 'aria-label': '次の月', onclick: function () { month = new Date(y, m + 1, 1); render(); } }, '›')),
    h('div', { class: 'cal' }, cells),
    h('div', { class: 'day' },
      h('h3', null, label(selected) + 'の予定'),
      evs.length ? h('ul', null, evs.map(function (e) { return eventRow(e, false); })) : h('p', { class: 'empty' }, '予定はありません。')));
}

function upcoming() {
  var end = new Date(); end.setDate(end.getDate() + 13);
  var to = ymd(end);
  var list = data.events.filter(function (e) { return e.date >= today && e.date <= to; }).sort(byTime);
  var body;
  if (!list.length) body = h('p', { class: 'empty' }, '今後2週間の予定はありません。');
  else {
    var dates = [];
    list.forEach(function (e) { if (dates.indexOf(e.date) < 0) dates.push(e.date); });
    body = dates.map(function (dt) {
      return h('div', { class: 'group' }, h('h3', null, label(dt) + (dt === today ? '　本日' : '')),
        h('ul', null, list.filter(function (e) { return e.date === dt; }).map(function (e) { return eventRow(e, false); })));
    });
  }
  return h('section', { class: 'card' }, h('h2', null, '今後2週間の予定', h('a', { href: '#schedule' }, 'スケジュール画面 →')), body);
}

// ---------- 画面 ----------
function mainPage() {
  return h('div', { class: 'grid' },
    calendar(),
    h('div', { class: 'stack' },
      h('section', { class: 'card' }, h('h2', null, 'TODO', h('a', { href: '#todo' }, 'TODO画面 →')), todoList(false)),
      upcoming(),
      recentFiles()));
}

function todoPage() {
  var text = h('input', { type: 'text', required: '', maxlength: '120', placeholder: 'やること' });
  var pri = h('select', null, h('option', { value: '1' }, '高'), h('option', { value: '2', selected: '' }, '中'), h('option', { value: '3' }, '低'));
  var form = h('form', { onsubmit: function (ev) {
    ev.preventDefault();
    var v = text.value.trim(); if (!v) return;
    data.todos.push({ id: uid(), text: v, pri: Number(pri.value) }); save(); render();
  } },
    h('label', null, 'TODO', text),
    h('label', null, '優先度', pri),
    h('button', { class: 'primary', type: 'submit' }, '登録する'));
  return h('div', { class: 'grid two' },
    h('section', { class: 'card' }, h('h2', null, 'TODOの登録'), form),
    h('section', { class: 'card' }, h('h2', null, 'TODO一覧'), todoList(true)));
}

function schedulePage() {
  var date = h('input', { type: 'date', required: '', value: selected });
  var time = h('input', { type: 'time' });
  var title = h('input', { type: 'text', required: '', maxlength: '120', placeholder: '予定の内容' });
  var form = h('form', { onsubmit: function (ev) {
    ev.preventDefault();
    var v = title.value.trim(); if (!v || !date.value) return;
    data.events.push({ id: uid(), date: date.value, time: time.value, title: v });
    selected = date.value; month = parse(date.value); month.setDate(1);
    save(); render();
  } },
    h('div', { class: 'row' }, h('label', null, '日付', date), h('label', null, '時刻（任意）', time)),
    h('label', null, '予定', title),
    h('button', { class: 'primary', type: 'submit' }, '登録する'));
  var list = data.events.filter(function (e) { return e.date >= today; }).sort(byTime);
  var dates = [];
  list.forEach(function (e) { if (dates.indexOf(e.date) < 0) dates.push(e.date); });
  var body = list.length ? dates.map(function (dt) {
    return h('div', { class: 'group' }, h('h3', null, label(dt)),
      h('ul', null, list.filter(function (e) { return e.date === dt; }).map(function (e) { return eventRow(e, true); })));
  }) : h('p', { class: 'empty' }, 'これからの予定はありません。');
  return h('div', { class: 'grid two' },
    h('section', { class: 'card' }, h('h2', null, 'スケジュールの登録'), form),
    h('section', { class: 'card' }, h('h2', null, 'これからの予定'), body));
}

function fileRow(f, withDelete) {
  return h('li', { class: 'frow' },
    h('span', { class: 'n' }, f.name),
    h('span', { class: 'm' }, fmtSize(f.size) + '　' + fmtDate(f.createdAt)),
    h('button', { class: 'ghost', onclick: function () { downloadFile(f); } }, 'ダウンロード'),
    withDelete ? h('button', { class: 'ghost', onclick: function () { deleteFile(f); } }, '削除') : null);
}

function recentFiles() {
  var list = files.slice(0, 5);
  return h('section', { class: 'card' }, h('h2', null, '最近の共有ファイル', h('a', { href: '#files' }, 'ファイル画面 →')),
    list.length ? h('ul', null, list.map(function (f) { return fileRow(f, false); })) : h('p', { class: 'empty' }, 'ファイルはありません。'),
    h('p', { class: 'empty', id: 'filemsg' }, fileMsg));
}

function filesPage() {
  var input = h('input', { type: 'file', required: '' });
  var form = h('form', { onsubmit: async function (ev) {
    ev.preventDefault();
    if (!input.files[0]) return;
    await uploadFile(input.files[0]);
    input.value = '';
  } },
    h('label', null, 'ファイル（1つあたり ' + fmtSize(MAX_FILE) + ' まで）', input),
    h('button', { class: 'primary', type: 'submit' }, '保存する'),
    h('p', { class: 'empty', id: 'filemsg' }, fileMsg));
  return h('div', { class: 'grid two' },
    h('section', { class: 'card' }, h('h2', null, 'ファイルの保存'), form),
    h('section', { class: 'card' }, h('h2', null, '共有ファイル一覧'),
      files.length ? h('ul', null, files.map(function (f) { return fileRow(f, true); })) : h('p', { class: 'empty' }, 'ファイルはありません。')));
}

// ---------- 表示の切り替え ----------
var PAGES = { main: ['メイン', mainPage], todo: ['TODO', todoPage], schedule: ['スケジュール', schedulePage], files: ['ファイル', filesPage] };
function loginPage() {
  var email = h('input', { type: 'email', required: '', autocomplete: 'username', placeholder: 'メールアドレス' });
  var pw = h('input', { type: 'password', required: '', autocomplete: 'current-password', placeholder: 'パスワード' });
  var msg = h('p', { class: 'empty', role: 'alert' });
  var form = h('form', { onsubmit: async function (ev) {
    ev.preventDefault();
    msg.textContent = 'ログイン中…';
    try { await signInWithEmailAndPassword(auth, email.value.trim(), pw.value); }
    catch (e) { msg.textContent = 'ログインできませんでした。メールアドレスとパスワードを確認してください。'; }
  } },
    h('label', null, 'メールアドレス', email),
    h('label', null, 'パスワード', pw),
    h('button', { class: 'primary', type: 'submit' }, 'ログイン'),
    msg);
  return h('section', { class: 'card', style: 'max-width:420px;margin:32px auto' }, h('h2', null, 'ログイン'), form);
}

function render() {
  if (!configured || !user || !loaded) {
    document.getElementById('nav').replaceChildren();
    var body = !configured ? h('section', { class: 'card' }, h('p', { class: 'empty' }, 'Firebaseの設定値が未入力です。index.htmlの firebaseConfig を書き換えてください。'))
      : !user ? loginPage()
      : h('section', { class: 'card' }, h('p', { class: 'empty' }, '読み込み中…'));
    document.getElementById('app').replaceChildren(body);
    return;
  }
  var r = location.hash.slice(1);
  if (!PAGES[r]) r = 'main';
  document.getElementById('nav').replaceChildren.apply(document.getElementById('nav'),
    Object.keys(PAGES).map(function (k) { return h('a', { href: '#' + k, class: k === r ? 'on' : '' }, PAGES[k][0]); }));
  document.getElementById('app').replaceChildren(PAGES[r][1]());
}
window.addEventListener('hashchange', render);
document.getElementById('logout').addEventListener('click', function () { signOut(auth); });
render();

if (configured) {
  onAuthStateChanged(auth, function (u) {
    user = u; loaded = false; ref = null;
    if (unsub) { unsub(); unsub = null; }
    data = { todos: [], events: [] };
    files = []; fileMsg = '';
    if (filesUnsub) { filesUnsub(); filesUnsub = null; }
    document.getElementById('logout').hidden = !u;
    if (!u) { setSync(''); render(); return; }
    ref = doc(db, 'users', u.uid);
    filesUnsub = onSnapshot(query(collection(db, 'users', u.uid, 'files'), orderBy('createdAt', 'desc')), function (snap) {
      files = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (loaded) softRender();
    }, function () { setFileMsg('ファイル一覧を読み込めませんでした'); });
    setSync('サーバーと同期中…');
    render();
    var timer = setTimeout(function () { setSync('サーバーに接続できていません。接続できしだい自動で同期します'); }, 10000);
    unsub = onSnapshot(ref, function (snap) {
      if (snap.metadata.hasPendingWrites) return;
      if (snap.metadata.fromCache) return;
      clearTimeout(timer);
      setSync('サーバーに保存済み');
      var d = snap.exists() ? snap.data() : null;
      var next = { todos: d && Array.isArray(d.todos) ? d.todos : [], events: d && Array.isArray(d.events) ? d.events : [] };
      var first = !loaded;
      loaded = true;
      if (first || JSON.stringify(next) !== JSON.stringify(data)) {
        data = JSON.parse(JSON.stringify(next));
        first ? render() : softRender();
      }
    }, function () { setSync('サーバーとの同期でエラーが発生しました'); });
  });
}
</script>
</body>
</html>
